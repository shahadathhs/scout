[project]
name = "scout-backend"
version = "0.1.0"
description = "scout — self-hosted deep-research platform backend"
authors = [{ name = "scout" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM simplify, C4 comprehensions, RUF ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008", # FastAPI uses Depends() in argument defaults by design.
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional.
"__init__.py" = ["F401"]
