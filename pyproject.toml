[project]
name = "research-agent"
version = "0.1.0"
description = "CLI AI research agent: plan, search, read, synthesize — with citations"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "ddgs>=9.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
research = "research_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
